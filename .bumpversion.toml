[tool.bumpversion]
current_version = "2.5.0-beta.1"
commit = true
tag = true
tag_name = "v{new_version}"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(-(?P<release>alpha|beta|rc|test)-(?P<build>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}-{build}",
    "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.release]
optional_value = "regular"
values = ["alpha", "beta", "rc", "test", "regular"]

[[tool.bumpversion.files]]
filename = "docker-compose.yml"
search = "IRIS_VERSION:-v{current_version}"
replace = "IRIS_VERSION:-v{new_version}"

[[tool.bumpversion.files]]
filename = ".env.example"
search = "IRIS_VERSION=v{current_version}"
replace = "IRIS_VERSION=v{new_version}"

[[tool.bumpversion.files]]
filename = "README.md"
search = "v{current_version}"
replace = "v{new_version}"
