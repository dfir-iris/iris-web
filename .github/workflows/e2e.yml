name: End-to-end tests

# Runs the SvelteKit UI Playwright suite (kept in iris-frontend/e2e) against
# a full V3 stack brought up by this repo's docker-compose.yml.
#
# Triggers:
#   - Manual (workflow_dispatch)
#   - Nightly at 03:00 UTC (flake detection against the current branch tags)
#   - Push to develop or master (master is the default branch — there is no
#     `main` here, so releases merged to master must trigger this too)
#   - repository_dispatch (sub-repo-published) — fired by iris-backend or
#     iris-frontend after they publish a new image; the payload names the
#     branch and SHA of the sub-repo that triggered the fan-in.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  repository_dispatch:
    types: [sub-repo-published]
  push:
    branches: [develop, master]

jobs:
  e2e:
    name: Playwright against live stack
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out iris-web with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log which sub-repo triggered us (if dispatched)
        if: github.event_name == 'repository_dispatch'
        env:
          SOURCE_REPO: ${{ github.event.client_payload.repo }}
          SOURCE_BRANCH: ${{ github.event.client_payload.branch }}
          SOURCE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          echo "Triggered by: repo=$SOURCE_REPO branch=$SOURCE_BRANCH sha=$SOURCE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iris-frontend/package-lock.json

      # The four packages are public, so an anonymous pull works. Logging in
      # anyway, because authenticated pulls get the higher GHCR rate limit.
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose .env
        env:
          POSTGRES_PASSWORD: ${{ secrets.E2E_POSTGRES_PASSWORD }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.E2E_POSTGRES_ADMIN_PASSWORD }}
          IRIS_SECRET_KEY: ${{ secrets.E2E_IRIS_SECRET_KEY }}
          IRIS_SECURITY_PASSWORD_SALT: ${{ secrets.E2E_IRIS_SECURITY_PASSWORD_SALT }}
          IRIS_ADM_PASSWORD: ${{ secrets.E2E_IRIS_ADM_PASSWORD }}
          IRIS_ADM_API_KEY: ${{ secrets.E2E_IRIS_ADM_API_KEY }}
        run: |
          cp .env.example .env
          {
            echo ""
            echo "# CI overrides"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "POSTGRES_ADMIN_PASSWORD=$POSTGRES_ADMIN_PASSWORD"
            echo "IRIS_SECRET_KEY=$IRIS_SECRET_KEY"
            echo "IRIS_SECURITY_PASSWORD_SALT=$IRIS_SECURITY_PASSWORD_SALT"
            echo "IRIS_ADM_USERNAME=administrator"
            echo "IRIS_ADM_PASSWORD=$IRIS_ADM_PASSWORD"
            echo "IRIS_ADM_API_KEY=$IRIS_ADM_API_KEY"
            echo "IRIS_HOSTNAME=localhost"
          } >> .env

      # Replaces a plain `docker compose pull`, which could only ever pull the
      # IRIS_VERSION default in docker-compose.yml — a release tag that does
      # not exist until a release is cut. e2e would then be gated on the
      # release and the release gated on e2e. Test the images under test.
      - name: Resolve and pull the images under test
        env:
          EVENT: ${{ github.event_name }}
          SRC_WORKFLOW: ${{ github.event.client_payload.workflow }}
          SRC_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail

          # The only multi-arch tags the build workflows publish come from
          # metadata-action's `type=ref,event=branch` and `type=semver`
          # (build-app.yml:136-139 and build.yml:101-104). There is no
          # `type=sha` pattern, so ghcr.io/dfir-iris/<pkg>:<sha> does not
          # exist. iris-frontend builds from master and the other three from
          # develop, so no single tag covers all four packages — verified
          # against the registry, not assumed.
          declare -A TAG=(
            [iris-backend]=develop
            [iris-db]=develop
            [iris-nginx]=develop
            [iris-frontend]=master
          )

          # Dispatched right after a sub-repo published: pin that one package
          # to the exact commit rather than trusting the branch tag, which a
          # later push may already have moved. Only the per-architecture
          # scratch tag is sha-addressable and the runner is amd64, so that is
          # what gets used. iris-backend builds three of the four packages, so
          # it is the workflow name in the payload that says which image was
          # rebuilt — the repo name cannot.
          if [ "$EVENT" = repository_dispatch ] && [ -n "${SRC_SHA:-}" ]; then
            case "${SRC_WORKFLOW:-}" in
              *'backend app image'*) pkg=iris-backend  ;;
              *'DB image'*)          pkg=iris-db       ;;
              *'Nginx image'*)       pkg=iris-nginx    ;;
              *'frontend image'*)    pkg=iris-frontend ;;
              *)
                pkg=''
                echo "::warning::Unrecognised dispatch workflow" \
                     "'${SRC_WORKFLOW:-}' — falling back to branch tags."
                ;;
            esac
            if [ -n "$pkg" ]; then
              sha_tag="ci-$SRC_SHA-amd64"
              if docker manifest inspect \
                   "ghcr.io/dfir-iris/$pkg:$sha_tag" >/dev/null 2>&1; then
                TAG[$pkg]=$sha_tag
              else
                echo "::warning::ghcr.io/dfir-iris/$pkg:$sha_tag is not in the" \
                     "registry — falling back to ${TAG[$pkg]}."
              fi
            fi
          fi

          # docker-compose.yml drives all five image references off a single
          # ${IRIS_VERSION}, and bump-my-version rewrites that default in
          # place (.bumpversion.toml:17-19), so it must not be reshaped into
          # one variable per service. Re-tag locally and point IRIS_VERSION at
          # that instead. Nothing pushes these tags, and `docker compose pull`
          # is deliberately not run afterwards — they exist only on this
          # runner, and compose's default pull policy leaves present images
          # alone.
          local_tag=e2e-under-test
          for pkg in "${!TAG[@]}"; do
            echo "$pkg -> ${TAG[$pkg]}"
            docker pull "ghcr.io/dfir-iris/$pkg:${TAG[$pkg]}"
            docker tag  "ghcr.io/dfir-iris/$pkg:${TAG[$pkg]}" \
                        "ghcr.io/dfir-iris/$pkg:$local_tag"
          done

          # Last assignment wins in an env file, which is the same mechanism
          # the Compose .env step above relies on for the secrets.
          echo "IRIS_VERSION=$local_tag" >> .env

      # Only .gitkeep is tracked under certificates/web_certificates/, so a
      # fresh checkout has no TLS cert and nginx exits with "cannot load
      # certificate" before its healthcheck can pass, failing `up --wait`.
      # Same script dev-up.sh uses. Playwright sets ignoreHTTPSErrors, so a
      # self-signed cert is fine here.
      - name: Generate the dev TLS certificate
        run: ./scripts/gen-dev-cert.sh

      - name: Bring stack up
        run: docker compose up -d --wait

      - name: Inspect stack on failure
        if: ${{ failure() }}
        run: |
          docker compose ps --all
          docker compose logs --tail=200

      - name: Install Playwright browsers
        working-directory: iris-frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox

      - name: Run Playwright
        working-directory: iris-frontend
        env:
          PLAYWRIGHT_BASE_URL: https://localhost
          IRIS_E2E_USERNAME: administrator
          IRIS_E2E_PASSWORD: ${{ secrets.E2E_IRIS_ADM_PASSWORD }}
          IRIS_E2E_API_KEY: ${{ secrets.E2E_IRIS_ADM_API_KEY }}
        run: npx playwright test

      - name: Capture container logs
        if: ${{ always() }}
        run: |
          mkdir -p artifacts
          docker compose logs > artifacts/docker-compose.log 2>&1 || true

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: iris-frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright junit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit
          path: iris-frontend/playwright-junit.xml
          if-no-files-found: ignore

      - name: Upload container logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: artifacts/docker-compose.log
          if-no-files-found: ignore

      - name: Tear down stack
        if: ${{ always() }}
        run: docker compose down -v
